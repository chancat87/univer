name: 📸 Manually Update Snapshots

# manual trigger
on:
    workflow_dispatch:
    schedule:
        - cron: '0 18 1 * *'

permissions:
    contents: read
    actions: write

jobs:
    update-snapshots:
        if: github.repository == 'dream-num/univer' && github.ref_name == 'dev'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: ./.github/actions/setup-node

            - name: Update Snapshots
              uses: ./.github/actions/update-snapshots
