name: 📸 Update Snapshots
description: Update Playwright snapshots and upload them as a workflow artifact.

runs:
    using: composite
    steps:
        - name: Clean Snapshot Directory
          shell: bash
          run: rm -rf .playwright-snapshots

        - name: Install Playwright Browsers
          shell: bash
          run: pnpm exec playwright install --with-deps chromium

        - name: Build E2E Client
          shell: bash
          run: pnpm build:e2e

        - name: Update Snapshots
          shell: bash
          env:
              PW_SNAPSHOT_DIR: .playwright-snapshots
          run: pnpm exec playwright test e2e/visual-comparison e2e/thread-comment --update-snapshots

        - name: Upload Snapshot Artifact
          uses: actions/upload-artifact@v7
          with:
              name: playwright-snapshots
              path: .playwright-snapshots/
              include-hidden-files: true
              retention-days: 90
